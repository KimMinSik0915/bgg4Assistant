<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>겨울향눈꽃 - Silver Mono</title>
  <defs>
    <radialGradient id="sky4" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#f4f7fa"/>
      <stop offset="55%" stop-color="#dfe6ec"/>
      <stop offset="100%" stop-color="#c3ccd6"/>
    </radialGradient>
    <radialGradient id="glow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#sky4)"/>

  <circle cx="400" cy="400" r="280" fill="url(#glow4)"/>

  <!-- minimalist line-art snow flower, no fill, monochrome -->
  <g transform="translate(400,400)" fill="none" stroke="#5b6b7c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- crystal arms -->
    <g opacity="0.55">
      <g id="arm4">
        <line x1="0" y1="0" x2="0" y2="-190"/>
        <line x1="0" y1="-105" x2="-30" y2="-138"/>
        <line x1="0" y1="-105" x2="30" y2="-138"/>
        <line x1="0" y1="-155" x2="-22" y2="-178"/>
        <line x1="0" y1="-155" x2="22" y2="-178"/>
      </g>
      <use href="#arm4" transform="rotate(60)"/>
      <use href="#arm4" transform="rotate(120)"/>
      <use href="#arm4" transform="rotate(180)"/>
      <use href="#arm4" transform="rotate(240)"/>
      <use href="#arm4" transform="rotate(300)"/>
    </g>

    <!-- petal outlines -->
    <g stroke-width="2.4" opacity="0.9">
      <g id="petal4">
        <path d="M0,-8 C32,-56 28,-112 0,-145 C-28,-112 -32,-56 0,-8 Z"/>
      </g>
      <use href="#petal4" transform="rotate(60)"/>
      <use href="#petal4" transform="rotate(120)"/>
      <use href="#petal4" transform="rotate(180)"/>
      <use href="#petal4" transform="rotate(240)"/>
      <use href="#petal4" transform="rotate(300)"/>
    </g>

    <g transform="rotate(30) scale(0.52)" opacity="0.6" stroke-width="2.2">
      <use href="#petal4"/>
      <use href="#petal4" transform="rotate(60)"/>
      <use href="#petal4" transform="rotate(120)"/>
      <use href="#petal4" transform="rotate(180)"/>
      <use href="#petal4" transform="rotate(240)"/>
      <use href="#petal4" transform="rotate(300)"/>
    </g>

    <!-- vein details -->
    <g stroke-width="1.2" opacity="0.5">
      <g id="vein4">
        <path d="M0,-16 C10,-52 9,-92 0,-120"/>
      </g>
      <use href="#vein4" transform="rotate(60)"/>
      <use href="#vein4" transform="rotate(120)"/>
      <use href="#vein4" transform="rotate(180)"/>
      <use href="#vein4" transform="rotate(240)"/>
      <use href="#vein4" transform="rotate(300)"/>
    </g>

    <circle r="22" fill="#ffffff" stroke="#5b6b7c" stroke-width="2" opacity="0.95"/>
    <circle r="22" fill="none"/>

    <g fill="#5b6b7c" stroke="none" opacity="0.55">
      <circle cx="70"  cy="-205" r="2.2"/>
      <circle cx="-102" cy="-160" r="1.7"/>
      <circle cx="158" cy="-44"  r="1.9"/>
      <circle cx="-158" cy="66"  r="1.5"/>
      <circle cx="128" cy="162"  r="2.1"/>
      <circle cx="-74" cy="205"  r="1.7"/>
    </g>
  </g>

  <!-- faint drifting snow specks -->
  <g fill="#8a97a5" opacity="0.35">
    <circle cx="90"  cy="140" r="2.0"/>
    <circle cx="200" cy="560" r="2.4"/>
    <circle cx="290" cy="200" r="1.7"/>
    <circle cx="360" cy="660" r="2.0"/>
    <circle cx="540" cy="600" r="2.4"/>
    <circle cx="640" cy="260" r="1.8"/>
    <circle cx="700" cy="560" r="2.2"/>
    <circle cx="730" cy="680" r="1.6"/>
    <circle cx="60"  cy="640" r="1.8"/>
  </g>
</svg>
