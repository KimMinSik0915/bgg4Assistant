<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>겨울향눈꽃 - Rose Dawn</title>
  <defs>
    <linearGradient id="sky3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b2440"/>
      <stop offset="45%" stop-color="#7a4a63"/>
      <stop offset="75%" stop-color="#c98a86"/>
      <stop offset="100%" stop-color="#f2c9b6"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#fff3ee" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ffd7cf" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffd7cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffaf7"/>
      <stop offset="55%" stop-color="#ffd9d0"/>
      <stop offset="100%" stop-color="#f2a49a"/>
    </linearGradient>
    <linearGradient id="petalShine3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffaf7"/>
      <stop offset="60%" stop-color="#ffe1d6"/>
      <stop offset="100%" stop-color="#f2a49a"/>
    </radialGradient>
    <filter id="soft3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#sky3)"/>

  <!-- soft sun disc low on horizon -->
  <circle cx="400" cy="560" r="140" fill="#ffe9df" opacity="0.35" filter="url(#soft3)"/>

  <!-- far snowy ridgeline in warm haze -->
  <path d="M0,600 Q120,560 240,590 T480,580 T800,600 L800,800 L0,800 Z" fill="#a9707a" opacity="0.55"/>
  <path d="M0,660 Q150,625 300,650 T600,645 T800,660 L800,800 L0,800 Z" fill="#5f3a4a" opacity="0.8"/>

  <circle cx="400" cy="360" r="270" fill="url(#glow3)"/>

  <g transform="translate(400,360)">
    <circle r="185" fill="#ffe1d6" opacity="0.18" filter="url(#soft3)"/>

    <g stroke="#fff3ee" stroke-width="3" stroke-linecap="round" opacity="0.75">
      <g id="arm3">
        <line x1="0" y1="0" x2="0" y2="-165"/>
        <line x1="0" y1="-92" x2="-25" y2="-121"/>
        <line x1="0" y1="-92" x2="25" y2="-121"/>
        <line x1="0" y1="-135" x2="-19" y2="-155"/>
        <line x1="0" y1="-135" x2="19" y2="-155"/>
      </g>
      <use href="#arm3" transform="rotate(60)"/>
      <use href="#arm3" transform="rotate(120)"/>
      <use href="#arm3" transform="rotate(180)"/>
      <use href="#arm3" transform="rotate(240)"/>
      <use href="#arm3" transform="rotate(300)"/>
    </g>

    <g id="petals3">
      <g id="petal3a">
        <path d="M0,-10 C33,-58 29,-114 0,-146 C-29,-114 -33,-58 0,-10 Z" fill="url(#petal3)" stroke="#fffaf7" stroke-width="1.5"/>
        <path d="M0,-20 C16,-56 14,-97 0,-124" fill="none" stroke="url(#petalShine3)" stroke-width="3" opacity="0.85"/>
      </g>
      <use href="#petal3a" transform="rotate(60)"/>
      <use href="#petal3a" transform="rotate(120)"/>
      <use href="#petal3a" transform="rotate(180)"/>
      <use href="#petal3a" transform="rotate(240)"/>
      <use href="#petal3a" transform="rotate(300)"/>
    </g>

    <g transform="rotate(30) scale(0.55)" opacity="0.95">
      <use href="#petal3a"/>
      <use href="#petal3a" transform="rotate(60)"/>
      <use href="#petal3a" transform="rotate(120)"/>
      <use href="#petal3a" transform="rotate(180)"/>
      <use href="#petal3a" transform="rotate(240)"/>
      <use href="#petal3a" transform="rotate(300)"/>
    </g>

    <circle r="26" fill="url(#core3)"/>
    <circle r="26" fill="none" stroke="#fffaf7" stroke-width="1.5" opacity="0.85"/>

    <g fill="#fffaf7">
      <circle cx="68"  cy="-185" r="2.4" opacity="0.9"/>
      <circle cx="-98" cy="-146" r="1.8" opacity="0.7"/>
      <circle cx="146" cy="-40"  r="2.0" opacity="0.8"/>
      <circle cx="-146" cy="58"  r="1.6" opacity="0.6"/>
      <circle cx="118" cy="146"  r="2.2" opacity="0.85"/>
      <circle cx="-68" cy="185"  r="1.8" opacity="0.7"/>
    </g>
  </g>

  <!-- drifting petals / snow, warm-tinted -->
  <g fill="#fff3ee">
    <circle cx="60"  cy="120" r="2.2" opacity="0.6"/>
    <circle cx="180" cy="500" r="3.0" opacity="0.55"/>
    <circle cx="260" cy="180" r="1.8" opacity="0.5"/>
    <circle cx="330" cy="600" r="2.6" opacity="0.55"/>
    <circle cx="500" cy="540" r="3.0" opacity="0.6"/>
    <circle cx="600" cy="240" r="2.0" opacity="0.5"/>
    <circle cx="680" cy="500" r="2.6" opacity="0.55"/>
    <circle cx="720" cy="620" r="1.8" opacity="0.5"/>
    <circle cx="40"  cy="580" r="2.0" opacity="0.5"/>
  </g>
</svg>
