<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>겨울향눈꽃 - Night Blue</title>
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#274472"/>
      <stop offset="55%" stop-color="#16294d"/>
      <stop offset="100%" stop-color="#0a1730"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eaf6ff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#bcdcff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bcdcff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#dbeeff"/>
      <stop offset="100%" stop-color="#a9d2f5"/>
    </linearGradient>
    <linearGradient id="petalShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cfe9ff"/>
      <stop offset="100%" stop-color="#8ec2ef"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <g fill="#ffffff">
    <circle cx="80"  cy="90"  r="1.6" opacity="0.8"/>
    <circle cx="140" cy="220" r="1.1" opacity="0.6"/>
    <circle cx="650" cy="70"  r="1.4" opacity="0.7"/>
    <circle cx="720" cy="180" r="1.8" opacity="0.85"/>
    <circle cx="60"  cy="480" r="1.2" opacity="0.6"/>
    <circle cx="740" cy="420" r="1.3" opacity="0.7"/>
    <circle cx="200" cy="60"  r="1.0" opacity="0.5"/>
    <circle cx="560" cy="130" r="1.0" opacity="0.5"/>
    <circle cx="100" cy="350" r="1.5" opacity="0.7"/>
    <circle cx="700" cy="300" r="1.0" opacity="0.5"/>
  </g>

  <circle cx="400" cy="380" r="260" fill="url(#moonGlow)"/>

  <path d="M0,650 Q120,600 240,640 T480,630 T800,650 L800,800 L0,800 Z" fill="#1c2f52" opacity="0.85"/>
  <path d="M0,700 Q150,660 300,690 T600,680 T800,700 L800,800 L0,800 Z" fill="#12213e"/>

  <g transform="translate(400,380)">
    <circle r="185" fill="#bfe3ff" opacity="0.12" filter="url(#soft)"/>

    <g stroke="#eaf6ff" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <g id="arm">
        <line x1="0" y1="0" x2="0" y2="-170"/>
        <line x1="0" y1="-95" x2="-26" y2="-125"/>
        <line x1="0" y1="-95" x2="26" y2="-125"/>
        <line x1="0" y1="-140" x2="-20" y2="-160"/>
        <line x1="0" y1="-140" x2="20" y2="-160"/>
      </g>
      <use href="#arm" transform="rotate(60)"/>
      <use href="#arm" transform="rotate(120)"/>
      <use href="#arm" transform="rotate(180)"/>
      <use href="#arm" transform="rotate(240)"/>
      <use href="#arm" transform="rotate(300)"/>
    </g>

    <g id="petals">
      <g id="petal">
        <path d="M0,-10 C34,-60 30,-118 0,-150 C-30,-118 -34,-60 0,-10 Z" fill="url(#petal)" stroke="#ffffff" stroke-width="1.5"/>
        <path d="M0,-20 C16,-58 14,-100 0,-128" fill="none" stroke="url(#petalShine)" stroke-width="3" opacity="0.8"/>
      </g>
      <use href="#petal" transform="rotate(60)"/>
      <use href="#petal" transform="rotate(120)"/>
      <use href="#petal" transform="rotate(180)"/>
      <use href="#petal" transform="rotate(240)"/>
      <use href="#petal" transform="rotate(300)"/>
    </g>

    <g id="petalsInner" transform="rotate(30) scale(0.55)" opacity="0.95">
      <use href="#petal"/>
      <use href="#petal" transform="rotate(60)"/>
      <use href="#petal" transform="rotate(120)"/>
      <use href="#petal" transform="rotate(180)"/>
      <use href="#petal" transform="rotate(240)"/>
      <use href="#petal" transform="rotate(300)"/>
    </g>

    <circle r="26" fill="url(#core)"/>
    <circle r="26" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>

    <g fill="#ffffff">
      <circle cx="70"  cy="-190" r="2.4" opacity="0.9"/>
      <circle cx="-100" cy="-150" r="1.8" opacity="0.7"/>
      <circle cx="150" cy="-40"  r="2.0" opacity="0.8"/>
      <circle cx="-150" cy="60"  r="1.6" opacity="0.6"/>
      <circle cx="120" cy="150"  r="2.2" opacity="0.85"/>
      <circle cx="-70" cy="190"  r="1.8" opacity="0.7"/>
    </g>
  </g>

  <g fill="#ffffff">
    <circle cx="60"  cy="120" r="2.2" opacity="0.8"/>
    <circle cx="180" cy="500" r="2.6" opacity="0.7"/>
    <circle cx="260" cy="180" r="1.8" opacity="0.6"/>
    <circle cx="330" cy="620" r="2.2" opacity="0.7"/>
    <circle cx="500" cy="560" r="2.6" opacity="0.75"/>
    <circle cx="600" cy="240" r="2.0" opacity="0.65"/>
    <circle cx="680" cy="520" r="2.4" opacity="0.7"/>
    <circle cx="720" cy="640" r="1.8" opacity="0.6"/>
    <circle cx="40"  cy="600" r="2.0" opacity="0.65"/>
    <circle cx="420" cy="720" r="2.2" opacity="0.7"/>
    <circle cx="230" cy="720" r="1.6" opacity="0.55"/>
    <circle cx="560" cy="700" r="1.8" opacity="0.6"/>
  </g>
</svg>
